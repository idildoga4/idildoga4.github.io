<title>İdil'in Masası</title>

<style>
/* Düzen: tam ekran 3D pembe masa sahnesi. Masadaki her obje bir bölüm, noktaya basınca sağdan panel açılır ve kamera objeye yaklaşır. */
:root {
  --night: #1E0A1D;
  --night-2: #3B1238;
  --glow: #FFD3E8;
  --pink: #E0197D;
  --pink-hi: #FF5CA8;
  --lilac: #DCCBFF;
  --mint: #C8F2E2;
  --butter: #FFEFB3;
  --paper: #FFF4F9;
  --ink: #2A0E27;
  --muted: #74566F;
  --line: #F2CFE1;
  --font-display: "Unbounded", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --panel-w: min(480px, 92vw);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; color: var(--glow); font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  background: radial-gradient(120% 90% at 50% 20%, var(--night-2) 0%, var(--night) 70%);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, h4, p, ul, ol { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pink-hi); outline-offset: 3px; border-radius: 10px; }

#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }
.loading { position: fixed; inset: 0; display: grid; place-items: center; font: 500 13px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--pink-hi); pointer-events: none; transition: opacity .6s; }
.ready .loading { opacity: 0; }

.ui { position: fixed; inset: 0; pointer-events: none; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.ui > * { pointer-events: auto; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: calc(env(safe-area-inset-top, 0px) + 18px); pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.logo { font: 800 24px var(--font-display); letter-spacing: -.02em; color: #fff; text-shadow: 0 0 18px rgba(255, 92, 168, .7); white-space: nowrap; }
.logo i { font-style: normal; color: var(--pink-hi); }
.tag { padding-left: 16px; border-left: 1.5px solid rgba(255, 211, 232, .45); font: 500 12px var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--glow); white-space: nowrap; }
.nav { display: flex; align-items: center; gap: clamp(12px, 3vw, 34px); }
.nav button { background: none; border: 0; padding: 8px 2px; cursor: pointer; font: 500 13px var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--glow); transition: color .2s; }
.nav button:hover { color: var(--pink-hi); }
.nav .lang { padding: 6px 12px; border: 1.5px solid rgba(255, 211, 232, .55); border-radius: 999px; color: #fff; letter-spacing: .1em; }
.nav .lang:hover { background: var(--pink); border-color: var(--pink); color: #fff; }

.hint { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); font: 500 12px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: rgba(255, 211, 232, .75); display: flex; flex-wrap: wrap; gap: 4px 18px; pointer-events: none; max-width: calc(100% - 32px); }
.hint b { color: var(--pink-hi); font-weight: 500; }
.reset { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); padding: 12px 22px; border-radius: 999px; border: 1.5px solid rgba(255, 211, 232, .55); background: rgba(30, 10, 29, .55); backdrop-filter: blur(8px); font: 500 12.5px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: #fff; cursor: pointer; transition: background .2s, border-color .2s, transform .2s; white-space: nowrap; }
.reset:hover { background: var(--pink); border-color: var(--pink); }
.reset:active { transform: scale(.97); }

#hotspots { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.hs { position: absolute; left: 0; top: 0; margin: -13px 0 0 -13px; display: flex; align-items: center; gap: 9px; padding: 0; border: 0; background: none; cursor: pointer; pointer-events: auto; will-change: transform; }
.hs .dot { position: relative; width: 26px; height: 26px; border-radius: 50%; background: var(--pink); border: 3px solid #fff; box-shadow: 0 0 16px rgba(255, 92, 168, .9); flex: none; transition: transform .2s cubic-bezier(.16,1,.3,1); }
.hs:hover .dot, .hs:focus-visible .dot { transform: scale(1.25); }
.hs .lbl { padding: 5px 12px; border-radius: 999px; background: rgba(30, 10, 29, .78); border: 1px solid rgba(255, 92, 168, .6); backdrop-filter: blur(6px); font: 500 11.5px var(--font-mono); letter-spacing: .08em; color: #fff; white-space: nowrap; }
.hs.off { visibility: hidden; }
@media (prefers-reduced-motion: no-preference) {
  .hs .dot::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 2px solid var(--pink-hi); animation: ping 2.2s cubic-bezier(.16,1,.3,1) infinite; }
  @keyframes ping { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(1.5); opacity: 0; } }
}
.nogl #hotspots { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 18px; padding: 90px 16px; }
.nogl .hs { position: static; margin: 0; transform: none !important; }

.panel { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); width: var(--panel-w); background: var(--paper); color: var(--ink); border-radius: 26px; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .7); display: flex; flex-direction: column; overflow: hidden; visibility: hidden; transform: translateX(calc(100% + 30px)); transition: transform .55s cubic-bezier(.16,1,.3,1), visibility 0s .55s; z-index: 5; pointer-events: auto; }
.panel.open { visibility: visible; transform: none; transition-delay: 0s; }
.phead { display: flex; align-items: center; gap: 10px; padding: 14px 14px 12px 18px; border-bottom: 1.5px solid var(--line); }
.pills { display: flex; gap: 6px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; padding-block: 2px; }
.pills::-webkit-scrollbar { display: none; }
.pill { flex: none; padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); font: 500 12.5px var(--font-body); cursor: pointer; transition: background .2s, border-color .2s; }
.pill:hover { border-color: var(--pink); }
.pill[aria-current="true"] { background: var(--pink); border-color: var(--pink); color: #fff; }
.close { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--line); background: #fff; cursor: pointer; font-size: 18px; line-height: 1; color: var(--ink); }
.close:hover { border-color: var(--pink); color: var(--pink); }
.pbody { overflow-y: auto; padding: 26px 22px 34px; flex: 1; min-height: 0; overscroll-behavior: contain; }
.sec { display: flex; flex-direction: column; gap: 22px; }
.sec[hidden] { display: none; }
.sec h2 { font: 800 clamp(24px, 4.4vw, 30px) var(--font-display); line-height: 1.1; letter-spacing: -.03em; text-wrap: balance; }
.sec h2 span { color: var(--pink); }
.lead { color: var(--muted); font-size: 16.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 12px var(--font-mono); padding: 4px 11px; border-radius: 999px; background: #fff; border: 1px solid var(--line); color: var(--ink); }
.chip.hi { background: var(--pink); border-color: var(--pink); color: #fff; }
.badge { align-self: flex-start; font: 500 11.5px var(--font-mono); padding: 4px 11px; border-radius: 999px; background: #FFE3F0; color: var(--ink); }

.yr { display: flex; flex-direction: column; gap: 12px; }
.yr h3 { font: 800 30px var(--font-display); color: transparent; -webkit-text-stroke: 1.5px var(--pink); letter-spacing: -.03em; display: flex; align-items: center; gap: 12px; }
.yr h3::after { content: ""; flex: 1; height: 1.5px; background: var(--line); }
.pj { background: #fff; border: 1.5px solid var(--line); border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; transition: transform .25s cubic-bezier(.16,1,.3,1), border-color .2s; }
.pj:hover { transform: translateY(-3px); border-color: var(--pink); }
.pj h4 { font: 700 16px var(--font-display); letter-spacing: -.02em; }
.pj p { font-size: 14.5px; color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.links a { font-weight: 600; font-size: 14px; color: var(--pink); text-decoration: none; }
.links a:hover { text-decoration: underline; text-underline-offset: 4px; }

.cap { background: #fff; border: 1.5px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 26px; font-size: 14.5px; }
.meta b { display: block; font: 500 11px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.steps { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.steps li { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #fff; border: 1.5px solid var(--line); font-weight: 500; font-size: 15px; }
.steps .ic { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 13px; background: var(--pink); color: #fff; margin-top: 1px; }

.wip { background: #fff; border: 1.5px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.shots { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; scrollbar-width: thin; scrollbar-color: var(--pink) transparent; }
.shot { flex: 0 0 112px; aspect-ratio: 9 / 19.5; border-radius: 18px; border: 3px solid var(--ink); overflow: hidden; scroll-snap-align: start; background: var(--line); }
.shotw { display: block; border-radius: 14px; border: 1.5px solid var(--line); overflow: hidden; }
.shotw img { display: block; width: 100%; height: auto; }
.shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
.wip h3 { font: 700 19px var(--font-display); letter-spacing: -.02em; }
.wip p { font-size: 15px; }
.wip .st { align-self: flex-start; font: 500 11.5px var(--font-mono); padding: 4px 11px; border-radius: 999px; background: #FFE3F0; color: var(--ink); }

.grp { background: #fff; border: 1.5px solid var(--line); border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.grp h3 { font: 700 15px var(--font-display); letter-spacing: -.02em; }
.learn { border: 2px dashed var(--pink); border-radius: 18px; padding: 18px; background: #fff; display: flex; flex-direction: column; gap: 10px; }
.learn h3 { font: 700 17px var(--font-display); letter-spacing: -.02em; }
.learn ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }

.photo { width: 170px; aspect-ratio: 1; border-radius: 42% 58% 55% 45% / 48% 40% 60% 52%; overflow: hidden; background: var(--lilac); border: 4px solid var(--pink); }
.photo img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 38% 28%; }
.big { font-size: 19px; line-height: 1.45; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.fact { background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 14px; }
.fact b { display: block; font: 500 11px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--pink); }
.tl { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.tl li { background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 14.5px; }
.tl small { display: block; font: 500 11.5px var(--font-mono); color: var(--pink); }
.tl b { font-weight: 600; }
.sub { font: 700 15px var(--font-display); letter-spacing: -.02em; }

.mail { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.mail code { font: 500 16px var(--font-mono); padding: 12px 18px; border-radius: 999px; background: #fff; border: 1.5px solid var(--pink); color: var(--pink); user-select: all; overflow-wrap: anywhere; }
.btn { padding: 12px 22px; border-radius: 999px; border: 2px solid var(--ink); background: var(--ink); color: #fff; font: 600 15px var(--font-body); cursor: pointer; white-space: nowrap; transition: transform .2s cubic-bezier(.16,1,.3,1); }
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: scale(.98); }
.socials { display: flex; flex-wrap: wrap; gap: 8px 22px; font-weight: 600; }
.socials a { color: var(--ink); text-underline-offset: 5px; }
.socials a:hover { color: var(--pink); }

@media (max-width: 900px) {
  .tag { display: none; }
  .hint { bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); }
  .panel { top: auto; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); width: auto; height: 74dvh; transform: translateY(calc(100% + 30px)); border-radius: 26px 26px 20px 20px; }
}
@media (max-width: 620px) {
  .hs { width: 22px; height: 22px; margin: -11px 0 0 -11px; }
  .hs .dot { width: 22px; height: 22px; border-width: 2.5px; }
  .hs .lbl { position: absolute; top: 50%; left: 100%; transform: translateY(-50%); margin-left: 6px; padding: 3px 8px; font-size: 10.5px; letter-spacing: .04em; }
  .hs.left .lbl { left: auto; right: 100%; margin-left: 0; margin-right: 6px; }
  .logo { font-size: 20px; }
  .nav { gap: 10px; }
  .nav button { font-size: 11px; letter-spacing: .08em; }
  .facts { grid-template-columns: 1fr; }
  .hint { font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { .panel { transition-duration: 0s; } }
</style>
